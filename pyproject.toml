[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "endstone-antiphantom"
version = "0.1.0"
description = "Per-player phantom spawn preferences for Endstone"
readme = "README.md"
requires-python = ">=3.11,<3.16"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
test = ["endstone==0.11.14", "pytest>=8,<10", "build>=1.2,<2"]

[project.entry-points.endstone]
antiphantom = "endstone_antiphantom:AntiPhantom"

[project.urls]
Repository = "https://github.com/ReallocAll/endstone-antiphantom"
Issues = "https://github.com/ReallocAll/endstone-antiphantom/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_antiphantom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
